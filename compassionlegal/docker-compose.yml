version: "3.9"
# Compassionlegal — WordPress
# Source: C:\laragon\www\compassionlegal
# Domain: compassionlegal.com.au
# DB: compassionlegal_db / user / pass (replace with secure values)
services:
  wordpress:
    image: wordpress:6.5-php8.3-apache
    container_name: wp_compassionlegal
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: compassionlegal_user
      WORDPRESS_DB_PASSWORD: compassionlegal_pass
      WORDPRESS_DB_NAME: compassionlegal_db
    volumes:
      - compassionlegal_data:/var/www/html
    networks: [site_network, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compassionlegal.rule=Host(`compassionlegal.com.au`)"
      - "traefik.http.routers.compassionlegal.entrypoints=websecure"
      - "traefik.http.routers.compassionlegal.tls.certresolver=letsencrypt"
      - "traefik.http.services.compassionlegal.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_proxy"
  db:
    image: mariadb:10.11
    container_name: compassionlegal_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: compassionlegal_root
      MARIADB_DATABASE: compassionlegal_db
      MARIADB_USER: compassionlegal_user
      MARIADB_PASSWORD: compassionlegal_pass
    volumes: [compassionlegal_db_data:/var/lib/mysql]
    networks: [site_network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "compassionlegal_user", "-pcompassionlegal_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  compassionlegal_data: {}
  compassionlegal_db_data: {}
networks:
  site_network: {driver: bridge}
  proxy:
    external: true
    name: traefik_proxy
